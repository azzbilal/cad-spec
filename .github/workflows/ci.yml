name: rubric-harness

on:
  push:
  pull_request:

jobs:
  test-rubric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the cad_spec environment
        run: pip install -e environments/cad_spec

      - name: Run the adversarial rubric harness
        run: python scripts/test_rubric.py
